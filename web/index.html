<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Hammer Simulator</title>
<style>
:root{--bg:#e4eaee;--panel:#f6f8f9;--ink:#13232f;--mute:#5b6b76;--line:#c3ced5;--hi:#c8452d;--lo:#1f6fa8;--warn:#a8420f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI","Helvetica Neue",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:19px;margin:0}header p{margin:2px 0 0;color:var(--mute)}
main{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}label span{color:var(--mute)}
input,select{width:120px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:#fff;font:inherit;color:var(--ink)}
h2{font-size:13px;margin:10px 0 4px;font-weight:600}h2:first-child{margin-top:0}
canvas{width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:3px;margin-bottom:8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.bar input[type=range]{flex:1;min-width:160px;padding:0}
button{padding:6px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lo);outline-offset:2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.kv div{border-left:3px solid var(--line);padding-left:8px}.kv b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.kv small{color:var(--mute)}
#msg{color:var(--warn);min-height:1.4em;margin:0 0 8px}
</style></head><body>
<header><h1>Water hammer simulator</h1><p>Reservoir–pipe–valve transient solved with the Method of Characteristics (validated against Joukowsky, Michaud, and a Python reference).</p></header>
<main>
<section id="ctl">
<h2>Pipe</h2>
<label><span>Material</span><select id="mat"><option value="200e9,2.2e9,0.008,0.3">Steel</option><option value="170e9,2.2e9,0.010,0.28">Ductile iron</option><option value="3e9,2.2e9,0.012,0.4">PVC</option><option value="0.8e9,2.2e9,0.020,0.45">HDPE</option></select></label>
<label><span>Length (m)</span><input id="L" type="number" value="1000" min="10" step="10"></label>
<label><span>Inner diameter (mm)</span><input id="D" type="number" value="300" min="10"></label>
<label><span>Wall thickness (mm)</span><input id="e" type="number" value="8" min="0.5" step="0.5"></label>
<label><span>Young's modulus E (GPa)</span><input id="E" type="number" value="200" step="0.1"></label>
<label><span>Poisson ratio</span><input id="nu" type="number" value="0.3" step="0.01"></label>
<label><span>Pipe support</span><select id="support"><option value="anchored">Anchored</option><option value="free">One end free</option><option value="joints">Expansion joints</option></select></label>
<h2>Flow and reservoir</h2>
<label><span>Initial velocity (m/s)</span><input id="V0" type="number" value="1" step="0.1" min="0.05"></label>
<label><span>Reservoir head (m)</span><input id="Hres" type="number" value="100" min="1"></label>
<label><span>Darcy friction factor</span><input id="f" type="number" value="0.02" step="0.005" min="0"></label>
<h2>Valve</h2>
<label><span>Closure time (s)</span><input id="Tc" type="number" value="0.5" step="0.1" min="0"></label>
<label><span>Closure law</span><select id="law"><option value="linear">Linear</option><option value="two">Two-stage (fast then slow)</option></select></label>
<h2>Numerics</h2>
<label><span>Simulated time (s)</span><input id="T" type="number" value="15" min="1"></label>
<label><span>Reaches (N)</span><input id="N" type="number" value="100" min="10" max="400" step="10"></label>
</section>
<div>
<p id="msg"></p>
<div class="kv" id="kv"></div>
<div class="bar"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Time"><label>Speed <select id="spd" style="width:80px"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><span id="clock"></span></div>
<canvas id="pipe" height="190"></canvas>
<canvas id="hist" height="230"></canvas>
<canvas id="env" height="200"></canvas>
</div></main>
<script src="moc.js"></script>
<script>
const $=id=>document.getElementById(id), g=MOC.g, ids=['L','D','e','E','nu','support','V0','Hres','f','Tc','law','T','N'];
let S=null,tNow=0,playing=true,last=0,env=null,pk=null;
const bar=(H,p)=>p.rho*g*H/1e5, PV=2340, PATM=101325;
function params(){const v=k=>$(k).value,n=k=>parseFloat(v(k));
  return{L:n('L'),D:n('D')/1e3,e:n('e')/1e3,E:n('E')*1e9,nu:n('nu'),support:v('support'),V0:n('V0'),Hres:n('Hres'),f:n('f'),Tc:n('Tc'),law:v('law'),T:n('T'),N:Math.min(400,Math.round(n('N')))}}
function run(){
  const p=params(); $('msg').textContent='';
  if(Object.values(p).some(x=>typeof x==='number'&&!isFinite(x))||p.L<=0||p.D<=0||p.e<=0||p.E<=0){$('msg').textContent='Enter positive values for every pipe and numerics field.';return}
  try{S=MOC.simulate(p)}catch(err){$('msg').textContent=err.message;return}
  const {W,steps,field}=S,max=new Float32Array(W).fill(-1e9),min=new Float32Array(W).fill(1e9);let hi=-1e9,lo=1e9,nh=0,nl=0,rng=1e-9;
  for(let n=0;n<=steps;n++)for(let i=0;i<W;i++){const h=field[n*W+i];if(h>max[i])max[i]=h;if(h<min[i])min[i]=h;
    if(i===W-1){if(h>hi){hi=h;nh=n}if(h<lo){lo=h;nl=n}} rng=Math.max(rng,Math.abs(h-field[i]))}
  env={max,min,rng}; pk={hi,lo,th:nh*S.dt,tl:nl*S.dt};
  $('scrub').max=steps; tNow=0; readouts(); draw();
}
function readouts(){
  const p=S.p,a=S.a,dH=a*p.V0/g,Hvap=-(PATM-PV)/(p.rho*g),crit=2*p.L/a,fm=(x,d=2)=>x.toFixed(d);
  const hv0=S.field[S.W-1], vap=pk.lo<Hvap;
  $('kv').innerHTML=[
   ['Wave speed',fm(a,0)+' m/s','from K, E, D/e'],['Critical time 2L/a',fm(crit,3)+' s',p.Tc<=crit?'rapid closure':'slow closure'],
   ['Joukowsky ρaΔV',fm(bar(dH,p),2)+' bar',fm(dH,1)+' m head, full stop'],['Steady valve pressure',fm(bar(hv0,p),2)+' bar',fm(hv0,1)+' m'],
   ['Peak at valve',fm(bar(pk.hi,p),2)+' bar','t = '+fm(pk.th,3)+' s'],['Minimum at valve',fm(bar(pk.lo,p),2)+' bar','t = '+fm(pk.tl,3)+' s']
  ].map(r=>`<div><small>${r[0]}</small><b>${r[1]}</b><small>${r[2]}</small></div>`).join('');
  $('msg').textContent=vap?`Head falls below vapor pressure (${fm(bar(Hvap,p),2)} bar gauge) at the valve. Column separation would occur; this model has no cavitation, so results after that point are not valid.`:'';
}
function setup(c){const r=devicePixelRatio||1,w=c.clientWidth,h=+(c.dataset.h||(c.dataset.h=c.getAttribute('height')));c.style.height=h+'px';c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);x.font='12px "Segoe UI",system-ui,sans-serif';return{x,w,h}}
function ramp(u){u=Math.max(-1,Math.min(1,u));const k=Math.abs(u),c=u<0?[31,111,168]:[200,69,45],b=[236,240,242];return`rgb(${b.map((v,i)=>Math.round(v+(c[i]-v)*k)).join()})`}
function plot(c,series,xr,yr,xl,yl,cur,hl){
  const{x,w,h}=setup(c),m={l:52,r:12,t:14,b:30},X=v=>m.l+(v-xr[0])/(xr[1]-xr[0])*(w-m.l-m.r),Y=v=>h-m.b-(v-yr[0])/(yr[1]-yr[0])*(h-m.t-m.b);
  x.strokeStyle='#e1e7ea';x.fillStyle='#5b6b76';x.lineWidth=1;
  const step=nice((yr[1]-yr[0])/5);for(let v=Math.ceil(yr[0]/step)*step;v<=yr[1];v+=step){x.beginPath();x.moveTo(m.l,Y(v));x.lineTo(w-m.r,Y(v));x.stroke();x.fillText(v.toFixed(step<1?1:0),6,Y(v)+4)}
  const sx=nice((xr[1]-xr[0])/6);for(let v=0;v<=xr[1];v+=sx)x.fillText(+v.toFixed(2),X(v)-8,h-12);
  x.fillText(xl,w-m.r-x.measureText(xl).width,h-1);x.fillText(yl,6,11);
  if(hl!=null){x.strokeStyle='#a8420f';x.setLineDash([5,4]);x.beginPath();x.moveTo(m.l,Y(hl));x.lineTo(w-m.r,Y(hl));x.stroke();x.setLineDash([]);x.fillStyle='#a8420f';x.fillText('vapor pressure',m.l+4,Y(hl)-4)}
  series.forEach(s=>{x.strokeStyle=s.c;x.lineWidth=1.6;x.beginPath();s.d.forEach((v,i)=>{const px=X(s.x[i]),py=Y(v);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle=s.c;x.fillText(s.n,m.l+6+(s.o||0),m.t+10)});
  if(cur!=null){x.strokeStyle='#13232f';x.lineWidth=1;x.beginPath();x.moveTo(X(cur),m.t);x.lineTo(X(cur),h-m.b);x.stroke()}
}
const nice=r=>{const e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*e};
function draw(){
  if(!S)return;const p=S.p,n=Math.min(S.steps,Math.round(tNow/S.dt)),W=S.W,{x,w,h}=setup($('pipe')),f=S.field;
  const x0=50,x1=w-30,cy=h/2-8,hw=22;x.fillStyle='#5b6b76';x.fillText('Reservoir',4,cy-hw-10);x.fillText('Valve',x1-6,cy-hw-10);
  x.fillStyle='#bcd3e3';x.fillRect(4,cy-hw-6,x0-8,hw*2+12);
  const pts=[];for(let i=0;i<W;i++){const d=f[n*W+i]-f[i],u=d/env.rng;pts.push([x0+(x1-x0)*i/(W-1),u])}
  for(let i=0;i<W-1;i++){const u=(pts[i][1]+pts[i+1][1])/2,bw=hw+8*u;x.fillStyle=ramp(u);x.fillRect(pts[i][0],cy-bw,pts[i+1][0]-pts[i][0]+1,bw*2)}
  x.strokeStyle='#13232f';x.lineWidth=2;['','-'].forEach(sg=>{x.beginPath();pts.forEach((q,i)=>{const bw=hw+8*q[1],y=cy+(sg?bw:-bw);i?x.lineTo(q[0],y):x.moveTo(q[0],y)});x.stroke()});
  const tv=MOC.tau(n*S.dt,p.Tc,p.law),vh=hw*tv+2;x.fillStyle='#13232f';x.fillRect(x1,cy-hw-6,6,hw*2+12);x.fillStyle='#e4eaee';x.fillRect(x1,cy-vh,6,vh*2);
  x.fillStyle='#5b6b76';x.fillText('Pressure change vs steady state (wall bulge exaggerated). Blue = below, red = above. Full scale ±'+(bar(env.rng,p)).toFixed(2)+' bar',x0,h-8);
  const ts=[],hv=[],hm=[],tt=S.tArr,tmax=p.T,k=Math.max(1,Math.floor(S.steps/1500));
  for(let i=0;i<=S.steps;i+=k){ts.push(i*S.dt);hv.push(bar(S.Hv[i],p));hm.push(bar(S.Hm[i],p))}
  const all=hv.concat(hm),ylo=Math.min(...all),yhi=Math.max(...all),pad=(yhi-ylo)*.08||.1,Hvap=-(PATM-PV)/(p.rho*g),vb=bar(Hvap,p);
  plot($('hist'),[{x:ts,d:hv,c:'#c8452d',n:'Valve'},{x:ts,d:hm,c:'#1f6fa8',n:'Midpoint',o:60}],[0,tmax],[Math.min(ylo,vb)-pad,yhi+pad],'time (s)','pressure (bar gauge)',n*S.dt,vb);
  const xs=[],mx=[],mn=[],cu=[];for(let i=0;i<W;i++){xs.push(p.L*i/(W-1));mx.push(bar(env.max[i],p));mn.push(bar(env.min[i],p));cu.push(bar(f[n*W+i],p))}
  plot($('env'),[{x:xs,d:mx,c:'#c8452d',n:'Max'},{x:xs,d:mn,c:'#1f6fa8',n:'Min',o:36},{x:xs,d:cu,c:'#13232f',n:'Now',o:72}],[0,p.L],[Math.min(...mn,vb)-pad,Math.max(...mx)+pad],'distance from reservoir (m)','pressure envelope (bar)',null,vb);
  $('scrub').value=n;$('clock').textContent='t = '+(n*S.dt).toFixed(3)+' s';
}
function frame(ts){if(S&&playing){const dt=Math.min(.05,(ts-last)/1e3);tNow+=dt*(4*S.p.L/S.a/8)*parseFloat($('spd').value);if(tNow>=S.p.T)tNow=0;draw()}last=ts;requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('scrub').oninput=e=>{playing=false;$('play').textContent='Play';tNow=e.target.value*S.dt;draw()};
$('mat').onchange=e=>{const[E,K,t,nu]=e.target.value.split(',');$('E').value=E/1e9;$('e').value=t*1e3;$('nu').value=nu;run()};
let tm;ids.forEach(k=>$(k).addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(run,250)}));
addEventListener('resize',draw);run();requestAnimationFrame(frame);
</script></body></html>
